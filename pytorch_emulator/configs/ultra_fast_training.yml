# Ultra Fast Training Configuration
# Aggressive but practical batch size with reduced data for pandas

# Model Configuration
model:
  # Architecture 
  input_dim: 11
  shared_dims: [256, 128, 64]  # Same architecture as full training
  head_dim: 32
  dropout: 0.2
  
  # Loss function parameters
  alpha: 0.3                    # Balance classification vs regression
  huber_delta: 1.0              # Huber loss delta parameter
  conservation_weight: 0.1      # Weight for mass conservation penalty
  use_masking: true             # Only compute regression loss on active samples

# Training Configuration  
training:
  epochs: 3                    # Reduced to 3 epochs for time constraint
  learning_rate: 0.001
  weight_decay: 0.00001         
  gradient_clip_norm: 1.0
  early_stopping_patience: 5    # Reduced for quick test
  
  # Optimizer
  optimizer: "adam"
  
  # Learning rate scheduler
  scheduler: "reduce_lr_on_plateau"
  scheduler_params:
    mode: "min"
    factor: 0.5
    patience: 2                 # Faster reduction for quick test
    min_lr: 0.000001            

# Data Configuration - REDUCED FOR PANDAS MEMORY LIMITS
data:
  # Paths (NERSC-specific)
  data_path: "/pscratch/sd/d/dvpatel/mlmicrophysics_project/e3sm/processed_data/"
  out_path: "./ultra_fast_outputs/"
  
  # Data loading - REDUCED DATA, LARGE BATCHES  
  max_files: 20                 # Reduced files (20/762 = 2.6%)
  subsample: 0.05               # Much lower sample rate (5%) = 2.6% * 5% = 0.13% total
  train_fraction: 0.8           # Train/val split
  batch_size: 16384             # Large but safer: ~600 batches/epoch
  random_seed: 42
  
  # Feature columns
  input_cols:
    - "QC_TAU_in"              # Cloud water mixing ratio
    - "QR_TAU_in"              # Rain water mixing ratio  
    - "NC_TAU_in"              # Cloud droplet number concentration
    - "NR_TAU_in"              # Rain droplet number concentration
    - "PGAM"                   # Gamma distribution shape parameter
    - "LAMC"                   # Cloud droplet size distribution parameter
    - "LAMR"                   # Rain droplet size distribution parameter
    - "N0R"                    # Rain droplet intercept parameter
    - "RHO_CLUBB"              # Air density from CLUBB
    - "CLOUD"                  # Cloud fraction
    - "FREQR"                  # Rain frequency
    
  output_cols:
    - "qctend_TAU"             # Cloud water tendency
    - "nctend_TAU"             # Cloud droplet number tendency
    - "nrtend_TAU"             # Rain droplet number tendency

# Logging Configuration
logging:
  log_level: "INFO"
  save_checkpoints: true
  checkpoint_frequency: 1       # Save every epoch
  
  # Weights & Biases (optional)
  wandb:
    project: "constraint_aware_microphysics"
    entity: null
    name: "ultra_fast_training"

# Evaluation Configuration
evaluation:
  # Metrics to compute
  compute_physics_metrics: true
  compute_regime_metrics: true
  
  # Physics constraint validation
  constraint_tolerance:
    qrtend_min: 0.0             
    nctend_max: 0.0             
    mass_conservation: 0.000001     
    
  # Regime analysis
  active_threshold: 1e-12  

# Experiment Configuration
experiment:
  name: "ultra_fast_training"
  description: "MEMORY OPTIMIZED: 20 files, 5% subsample, 3 epochs, batch=16384"
  version: "1.0"
  
  # Reproducibility
  seed: 42
  deterministic: true 