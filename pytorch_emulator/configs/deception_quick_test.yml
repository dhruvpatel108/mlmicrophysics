experiment:
  name: "deception_distributed_test"
  version: "v0.1"
  description: "Quick 100-file, 1% subsample, 5-epoch Data distributed training test on Deception using optimized streaming loader"
  framework: "pytorch"

data:
  loader_type: "optimized"
  data_path: "/rcfs/projects/pioneercloud/dhruv/processed_data"
  out_path: "/people/pate014/nersc_mlmicro/outputs/deception_distributed_test"
  scaler_cache_dir: "/people/pate014/nersc_mlmicro/scaler_cache/deception_distributed_test"
  input_cols:
    - "QC_TAU_in"
    - "QR_TAU_in"
    - "NC_TAU_in"
    - "NR_TAU_in"
    - "PGAM"
    - "LAMC"
    - "LAMR"
    - "N0R"
    - "RHO_CLUBB"
    - "CLOUD"
    - "FREQR"
  output_cols:
    - "qctend_TAU"
    - "nctend_TAU"
    - "nrtend_TAU"
    - "qrtend_TAU"
  chunk_size: 1000000
  max_files: 100
  subsample: 0.05
  train_fraction: 0.8
  batch_size: 1048576
  num_workers: 0
  scaler_fit_samples: 1000000
  active_threshold: 1.0e-12
  random_seed: 42

model:
  input_dim: 11
  shared_dims: [256, 256, 128, 128, 64]
  head_dim: 64
  dropout: 0.1
  activation: "relu"
  constraint_enforcement: true
  mass_conservation: true
  alpha: 0.3
  huber_delta: 1.0
  conservation_weight: 0.1
  use_masking: true

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 1
  use_amp: false
  optimizer: "adam"
  scheduler: "reduce_lr_on_plateau"
  scheduler_params:
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-7
  gradient_clip_norm: 1.0
  early_stopping_patience: 10
  device: "auto"
  validation_frequency: 1
  checkpoint_frequency: 1

logging:
  log_level: "INFO"
  save_checkpoints: true
  log_frequency: 50

