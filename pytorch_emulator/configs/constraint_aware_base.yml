# Constraint-Aware Microphysics Emulator Configuration
# Base configuration for training the constraint-aware emulator

# Model Configuration
model:
  # Architecture
  input_dim: 11
  shared_dims: [256, 128, 64]
  head_dim: 32
  dropout: 0.1
  
  # Loss function parameters
  alpha: 0.3                    # Balance classification vs regression (0.3 = 30% classification)
  huber_delta: 1.0              # Huber loss delta parameter
  conservation_weight: 0.1      # Weight for mass conservation penalty
  use_masking: true             # Only compute regression loss on active samples

# Training Configuration  
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-5
  gradient_clip_norm: 1.0
  early_stopping_patience: 15
  
  # Optimizer
  optimizer: "adam"             # Options: adam, adamw, sgd
  
  # Learning rate scheduler
  scheduler: "reduce_lr_on_plateau"  # Options: reduce_lr_on_plateau, cosine, step, null
  scheduler_params:
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1e-7

# Data Configuration
data:
  # Paths (NERSC-specific)
  data_path: "/pscratch/sd/d/dvpatel/mlmicrophysics_project/e3sm/processed_data/"
  out_path: "./outputs/"
  
  # Data loading
  max_files: 10                 # Number of parquet files to load
  subsample: 0.1                # Fraction of data to use (0.1 = 10%)
  train_fraction: 0.8           # Train/val split
  batch_size: 1024
  random_seed: 42
  
  # Feature columns
  input_cols:
    - "QC_TAU_in"              # Cloud water mixing ratio
    - "QR_TAU_in"              # Rain water mixing ratio  
    - "NC_TAU_in"              # Cloud droplet number concentration
    - "NR_TAU_in"              # Rain droplet number concentration
    - "PGAM"                   # Gamma distribution shape parameter
    - "LAMC"                   # Cloud droplet size distribution parameter
    - "LAMR"                   # Rain droplet size distribution parameter
    - "N0R"                    # Rain droplet intercept parameter
    - "RHO_CLUBB"              # Air density from CLUBB
    - "CLOUD"                  # Cloud fraction
    - "FREQR"                  # Rain frequency
    
  output_cols:
    - "qctend_TAU"             # Cloud water tendency (derived = -qrtend)
    - "nctend_TAU"             # Cloud droplet number tendency
    - "nrtend_TAU"             # Rain droplet number tendency
    # Note: qrtend_TAU derived from qctend via mass conservation

# Logging Configuration
logging:
  log_level: "INFO"
  save_checkpoints: true
  checkpoint_frequency: 5       # Save every N epochs
  
  # Weights & Biases (optional)
  wandb:
    project: "mlmicrophysics"
    entity: null                # Your W&B username/organization
    group: "constraint_aware"
    job_type: "training"
    tags: 
      - "pytorch"
      - "constraint_aware"
      - "microphysics"
      - "e3sm"

# Evaluation Configuration
evaluation:
  # Metrics to compute
  compute_physics_metrics: true
  compute_regime_metrics: true
  
  # Physics constraint validation
  constraint_tolerance:
    qrtend_min: 0.0             # qrtend ≥ 0
    nctend_max: 0.0             # nctend ≤ 0
    mass_conservation: 1e-6     # |qctend + qrtend| < tolerance
    
  # Regime analysis
  active_threshold: 1e-8        # Threshold for active vs quiescent classification

# Experiment Configuration
experiment:
  name: "constraint_aware_base"
  description: "Baseline constraint-aware emulator with physical constraints"
  version: "1.0"
  
  # Reproducibility
  seed: 42
  deterministic: true 