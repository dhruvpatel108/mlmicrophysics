# FULL PRODUCTION Configuration for Optimized Streaming + Parallel Training
# Complete training run on entire dataset (762 parquet files)

experiment:
  name: "optimized_production_full"
  version: "v1.0-full"
  description: "FULL PRODUCTION: optimized loader, all 762 files, no subsampling, full training"
  framework: "pytorch"

data:
  loader_type: "optimized"  # Use optimized streaming data loader
  data_path: "/pscratch/sd/d/dvpatel/mlmicrophysics_project/e3sm/processed_data/"
  out_path: "/pscratch/sd/d/dvpatel/mlmicrophysics_project/pytorch_multi_gpu_outputs/"
  scaler_cache_dir: "/pscratch/sd/d/dvpatel/mlmicrophysics_project/scaler_cache_optimized/"
  input_cols:
    - "QC_TAU_in"
    - "QR_TAU_in"
    - "NC_TAU_in"
    - "NR_TAU_in"
    - "PGAM"
    - "LAMC"
    - "LAMR"
    - "N0R"
    - "RHO_CLUBB"
    - "CLOUD"
    - "FREQR"
  output_cols:
    - "qctend_TAU"
    - "nctend_TAU"
    - "nrtend_TAU"
    - "qrtend_TAU"
  chunk_size: 4194304  #max. number of rows in any parquet files=10,969,911
  max_files: 50        
  subsample: 0.1         
  train_fraction: 0.8
  batch_size: 4194304     
  num_workers: 0         
  scaler_fit_samples: 500000  
  active_threshold: 1.0e-12
  random_seed: 42

model:
  input_dim: 11
  shared_dims: [256, 256, 256, 128, 128, 64]  # Larger model for full dataset
  head_dim: 64
  dropout: 0.1
  activation: "relu"
  constraint_enforcement: true
  mass_conservation: true
  alpha: 0.2
  huber_delta: 1.0
  conservation_weight: 0.1
  use_masking: true

training:
  epochs: 100            # Full training epochs
  learning_rate: 0.001
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 1
  use_amp: false
  optimizer: "adam"
  scheduler: "reduce_lr_on_plateau"
  scheduler_params:
    mode: "min"
    factor: 0.5
    patience: 20
    min_lr: 1.0e-7
  gradient_clip_norm: 1.0
  early_stopping_patience: 50
  device: "auto"
  validation_frequency: 1
  checkpoint_frequency: 10

loss:
  conservation_weight: 0.1
  huber_delta: 1.0

logging:
  log_level: "INFO"
  save_checkpoints: true
  checkpoint_frequency: 2
  log_frequency: 50
  wandb:
    project: null
    entity: null
    group: null
    job_type: null
    tags: null

hardware:
  device: "auto"
  num_workers: 0
  pin_memory: true
  single_node:
    gpus: 4
    memory_per_gpu: "40GB"
  distributed:
    nodes: 1             # Use 1 node for stability (can scale up later)
    gpus_per_node: 4
    total_gpus: 4
    cpus_per_gpu: 8
    memory_per_node: "128GB"

evaluation:
  eval_frequency: 1
  compute_physics_metrics: true
  compute_regime_metrics: true
  constraint_tolerance:
    qrtend_min: 0.0
    nctend_max: 0.0
    mass_conservation: 1.0e-6
  active_threshold: 1.0e-12

advanced:
  pin_memory: true
  persistent_workers: false
  use_deterministic: false
  benchmark_mode: true
  save_top_k: 10
  save_last: true
  auto_resume: true     # Enable auto resume for long training
  checkpoint_every_n_steps: 2000

performance:
  target_throughput:
    single_gpu: 10000
  prefetch_factor: 2
  shuffle_buffer_size: 10000
  use_memory_mapping: false
  compression: "snappy"
  vectorized_preprocessing: true
  cache_preprocessed: false

tracking:
  primary_metric: "val_loss"
  secondary_metrics:
    - "train_loss"
    - "conservation_loss"
    - "classification_loss"
    - "regression_loss"
  track_throughput: true
  track_memory_usage: true
  track_gpu_utilization: true 